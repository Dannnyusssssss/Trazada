# Comprueba (lint, tests y build) y publica dist/ en GitHub Pages.
# Si alguna comprobación falla, no se publica nada.
name: Comprobar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos por defecto: solo lectura del repositorio.
permissions:
  contents: read

# Un único despliegue a la vez; no se cancela uno que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Falla si hay vulnerabilidades altas o críticas.
      - name: Auditar dependencias
        run: npm audit --audit-level=high
      # Falla si el código versionado contiene algo parecido a un secreto.
      - name: Buscar secretos en el repositorio
        # Código 0 = hay coincidencias (falla), 1 = ninguna (pasa), otro = error de la búsqueda (falla).
        # Este archivo se excluye porque contiene el propio patrón y el permiso id-token.
        run: |
          rc=0
          git grep -n -I -i -E "api[_-]?key|secret|token|passw|bearer|BEGIN (RSA|PRIVATE)" -- . ':!package-lock.json' ':!.github/workflows/deploy.yml' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "Posibles secretos en el repositorio."; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "La búsqueda de secretos falló."; exit "$rc"; fi
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Falla si el resultado empaquetado contiene algo parecido a un secreto.
      - name: Buscar secretos en dist
        run: |
          rc=0
          grep -r -n -I -i -E "api[_-]?key|secret|token|passw|bearer|BEGIN (RSA|PRIVATE)" dist/ || rc=$?
          if [ "$rc" -eq 0 ]; then echo "Posibles secretos en dist/."; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "La búsqueda de secretos en dist/ falló."; exit "$rc"; fi
      - name: Preparar el artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    # Solo se publica desde main (no desde pull requests).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
